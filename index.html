
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Wahrheit</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 15px;
}

h1 {
    color: #ff3333;
    font-size: 35px;
}

#messages {
    margin: 30px auto;
    max-width: 700px;
    overflow-wrap: anywhere;
    line-height: 1.5;
    font-size: 20px;
}

button {
    background: #ff3333;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: darkred;
}
</style>
</head>

<body>

<h1>Eine wichtige Mitteilung</h1>

<div id="messages">
    Du bist dumm, wenn du das liest.
</div>

<button onclick="deny()">Nein, bin ich nicht!</button>

<script>
let count = 1;

function deny() {
    count *= 2;

    const messages = document.getElementById("messages");
    const phrase = "Du bist dumm, wenn du das liest.";

    const visible = Math.min(count, 64);

    messages.innerHTML =
        Array(visible).fill(phrase).join("<br>");

    if (count > 64) {
        messages.innerHTML +=
        "<br><br>... UND NOCH " + 
        (count - 64).toLocaleString("de-DE") +
        " MAL! 😂";
    }
}
</script>

</body>
</html>
